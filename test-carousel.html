<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST CAROUSEL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        
        .thomas-pavy-hero {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .carousel-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .carousel-slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }
        .carousel-slide.active {
            opacity: 1;
            z-index: 2;
        }
        .slide-1 { background: #8B0000; }
        .slide-2 { background: #2E4057; }
        .slide-3 { background: #D4AF37; }
        .slide-4 { background: #2D572C; }
        .slide-5 { background: #4A0E4E; }
        
        .carousel-control {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.3);
            border: 2px solid white;
            color: white;
            width: 60px; height: 60px;
            border-radius: 50%;
            font-size: 2rem;
            cursor: pointer;
            z-index: 10;
        }
        .carousel-control:hover { background: rgba(255,255,255,0.6); }
        .prev { left: 20px; }
        .next { right: 20px; }
        
        .carousel-indicators {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .indicator {
            width: 15px; height: 15px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            border: 2px solid white;
            cursor: pointer;
        }
        .indicator.active {
            background: #D4AF37;
            border-color: #D4AF37;
            width: 40px;
            border-radius: 10px;
        }
        
        #debug {
            position: fixed;
            top: 10px; left: 10px;
            background: black;
            color: lime;
            padding: 10px;
            z-index: 9999;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="debug">Chargement...</div>

<section class="thomas-pavy-hero">
    <div class="carousel-container">
        <div class="carousel-slide slide-1 active">SLIDE 1 - TRADITION</div>
        <div class="carousel-slide slide-2">SLIDE 2 - PRESTIGE</div>
        <div class="carousel-slide slide-3">SLIDE 3 - ROSÉ</div>
        <div class="carousel-slide slide-4">SLIDE 4 - EPHÉMÈRE</div>
        <div class="carousel-slide slide-5">SLIDE 5 - HARMONY</div>
        
        <button class="carousel-control prev" id="btn-prev">‹</button>
        <button class="carousel-control next" id="btn-next">›</button>
        
        <div class="carousel-indicators">
            <span class="indicator active" data-slide="0"></span>
            <span class="indicator" data-slide="1"></span>
            <span class="indicator" data-slide="2"></span>
            <span class="indicator" data-slide="3"></span>
            <span class="indicator" data-slide="4"></span>
        </div>
    </div>
</section>

<script>
(function() {
    var debug = document.getElementById('debug');
    var current = 0;
    var slides = document.querySelectorAll('.carousel-slide');
    var dots = document.querySelectorAll('.indicator');
    
    debug.textContent = 'Slides trouvées: ' + slides.length;
    
    function go(index) {
        if (index < 0) index = slides.length - 1;
        if (index >= slides.length) index = 0;
        for (var i = 0; i < slides.length; i++) slides[i].classList.remove('active');
        for (var j = 0; j < dots.length; j++) dots[j].classList.remove('active');
        slides[index].classList.add('active');
        if (dots[index]) dots[index].classList.add('active');
        current = index;
        debug.textContent = 'Slide active: ' + (current + 1) + ' / ' + slides.length;
    }
    
    document.getElementById('btn-prev').addEventListener('click', function() { go(current - 1); });
    document.getElementById('btn-next').addEventListener('click', function() { go(current + 1); });
    
    for (var k = 0; k < dots.length; k++) {
        dots[k].addEventListener('click', function() {
            go(parseInt(this.getAttribute('data-slide')));
        });
    }
    
    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') go(current - 1);
        if (e.key === 'ArrowRight') go(current + 1);
    });
})();
</script>

</body>
</html>
